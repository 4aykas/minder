    --hub: #1D2128;
    --people-tint: #362C19;
    --model-tint: #1D3024;
    --digital-tint: #16302F;
    --record-tint: #36262A;
    --want-tint: #3D3418;

  * { box-sizing: border-box; margin: 0; }

  .fill-hask { fill: var(--hask-ink); }

  .box { stroke-width: 4; }

${''}

  .chrome {

  @media (prefers-reduced-motion: reduce) {

</style>

<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var WORLD = { x: 0, y: 0, w: 7400, h: 5750 };
  var CHAR = 0.52; // average advance of the UI face, in em

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function wrap(text, size, width) {
    var max = Math.max(8, Math.floor(width / (size * CHAR)));
    var words = String(text).split(' ');
    var lines = [];
    var line = '';
    words.forEach(function (w) {
      if (!line) line = w;
      else if ((line + ' ' + w).length <= max) line += ' ' + w;
      else { lines.push(line); line = w; }
    });
    if (line) lines.push(line);
    return lines;
  }

  // ── Content ───────────────────────────────────────────────────────
  var nodes = {};
  var out = { zones: [], nodes: [], edges: [], labels: [] };

  function textBlock(x, y, lines, size, cls, opts) {
    opts = opts || {};
    var lh = size * (opts.lh || 1.3);
    var anchor = opts.anchor || 'start';
    var weight = opts.weight ? ' font-weight="' + opts.weight + '"' : '';
    var style = opts.italic ? ' font-style="italic"' : '';
    var svg = lines.map(function (l, i) {
      return '<text x="' + x + '" y="' + (y + i * lh) + '" font-size="' + size + '" class="' + cls + '" text-anchor="' + anchor + '"' + weight + style + '>' + esc(l) + '</text>';
    }).join('');
    return { svg: svg, height: lines.length * lh };
  }

  // Box island: title + items, height from content
  function measureBox(o) {
    var pad = o.pad || 44;
    var inner = o.w - pad * 2;
    var titleLines = wrap(o.title, o.titleSize || 56, inner);
    var h = pad + titleLines.length * (o.titleSize || 56) * 1.12 + 18;
    var items = (o.items || []).map(function (it) {
      var ls = wrap(it, o.size || 34, inner - 26);
      h += ls.length * (o.size || 34) * 1.32 + 12;
      return ls;
    });
    return { titleLines: titleLines, items: items, h: Math.max(o.minH || 0, h + pad - 12) };
  }
  function box(id, o) {
    var m = measureBox(o);
    var pad = o.pad || 44;
    var tSize = o.titleSize || 56;
    var size = o.size || 34;
    var h = o.h || m.h;
    var rot = o.rot ? ' transform="rotate(' + o.rot + ' ' + (o.x + o.w / 2) + ' ' + (o.y + h / 2) + ')"' : '';
    var s = '<g class="node" data-id="' + id + '"' + rot + '>';
    s += '<rect class="box ' + o.cls + '" x="' + o.x + '" y="' + o.y + '" width="' + o.w + '" height="' + h + '" rx="' + (o.rx || 40) + '"/>';
    var y = o.y + pad + tSize * 0.85;
    var t = textBlock(o.x + pad, y, m.titleLines, tSize, o.titleCls || 'fill-ink', { weight: 750, lh: 1.12 });
    s += t.svg;
    y += t.height + 18 - tSize * 0.1;
    m.items.forEach(function (ls, i) {
      var raw = o.items[i];
      var placeholder = raw.indexOf('+ ') === 0;
      if (!placeholder && o.bullets !== false) {
        s += '<circle cx="' + (o.x + pad + 7) + '" cy="' + (y + size * 0.05 - size * 0.32) + '" r="6" class="' + (o.bulletCls || 'fill-muted') + '"/>';
      }
      var tb = textBlock(o.x + pad + (o.bullets === false ? 0 : 26), y + size * 0.05, ls, size, placeholder ? 'fill-muted' : (o.itemCls || 'fill-ink'), { lh: 1.32, italic: placeholder, weight: o.itemWeight });
      s += tb.svg;
      y += tb.height + 12;
    });
    s += '</g>';
    out.nodes.push(s);
    nodes[id] = { kind: 'rect', x: o.x, y: o.y, w: o.w, h: h, cx: o.x + o.w / 2, cy: o.y + h / 2 };
    return nodes[id];
  }

  // Hub: circle, shared hubs get a two-colour ring
  function hub(id, o) {
    var s = '<g class="node" data-id="' + id + '">';
    if (o.halo) {
      s += '<circle class="halo-tebin" cx="' + o.x + '" cy="' + o.y + '" r="' + (o.r + 70) + '" stroke-width="10"/>';
      s += '<circle class="halo-hask" cx="' + o.x + '" cy="' + o.y + '" r="' + (o.r + 130) + '" stroke-width="10"/>';
    }
    s += '<circle class="hub-face" cx="' + o.x + '" cy="' + o.y + '" r="' + o.r + '"/>';
    if (o.side === 'shared') {
      s += '<path class="ring-tebin" stroke-width="16" d="M ' + o.x + ' ' + (o.y - o.r) + ' A ' + o.r + ' ' + o.r + ' 0 0 0 ' + o.x + ' ' + (o.y + o.r) + '"/>';
      s += '<path class="ring-hask" stroke-width="16" d="M ' + o.x + ' ' + (o.y - o.r) + ' A ' + o.r + ' ' + o.r + ' 0 0 1 ' + o.x + ' ' + (o.y + o.r) + '"/>';
    } else {
      s += '<circle class="ring-' + o.side + '" stroke-width="16" cx="' + o.x + '" cy="' + o.y + '" r="' + o.r + '"/>';
    }
    var width = o.r * 1.55;
    var blocks = [];
    blocks.push({ lines: wrap(o.title, o.titleSize || 66, width), size: o.titleSize || 66, cls: o.side === 'hask' ? 'fill-hask' : o.side === 'tebin' ? 'fill-tebin' : 'fill-ink', weight: 800, gap: 14 });
    if (o.headline) blocks.push({ lines: wrap(o.headline, 46, width), size: 46, cls: 'fill-ink', weight: 700, gap: 12 });
    (o.items || []).forEach(function (it) { blocks.push({ lines: wrap(it, o.size || 33, width), size: o.size || 33, cls: 'fill-muted', gap: 6 }); });
    var total = blocks.reduce(function (a, b) { return a + b.lines.length * b.size * 1.2 + b.gap; }, 0);
    var y = o.y - total / 2 + blocks[0].size * 0.85;
    blocks.forEach(function (b) {
      var tb = textBlock(o.x, y, b.lines, b.size, b.cls, { anchor: 'middle', weight: b.weight, lh: 1.2 });
      s += tb.svg;
      y += tb.height + b.gap;
    });
    s += '</g>';
    out.nodes.push(s);
    nodes[id] = { kind: 'circle', cx: o.x, cy: o.y, r: o.r + (o.halo ? 60 : 0) };
  }

  // Smooth organic closed shape through points around an ellipse
  function blob(cx, cy, rx, ry, radii, cls, rotSeed) {
    var n = radii.length;
    var pts = radii.map(function (k, i) {
      var a = (i / n) * Math.PI * 2 + rotSeed;
      return [cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k];
    });
    var d = '';
    for (var i = 0; i < n; i++) {
      var p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      if (i === 0) d += 'M ' + p1[0].toFixed(1) + ' ' + p1[1].toFixed(1);
      var c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      var c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += ' C ' + c1[0].toFixed(1) + ' ' + c1[1].toFixed(1) + ', ' + c2[0].toFixed(1) + ' ' + c2[1].toFixed(1) + ', ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1);
    }
    out.zones.push('<path class="' + cls + '" d="' + d + ' Z" stroke-width="7" stroke-dasharray="26 18"/>');
  }

  // ── Title ──
  out.zones.push('<text x="300" y="330" font-size="170" font-weight="800" class="fill-ink">TEBIN and Haskoning</text>');
  out.zones.push('<text x="306" y="440" font-size="62" font-weight="500" class="fill-muted">Where the two networks meet</text>');

  // ── Territories ──
  blob(1330, 2000, 1180, 1330, [1, 1.05, 0.97, 1.08, 1.02, 0.95, 1.06, 1.0, 0.93, 1.04, 1.07, 0.98], 'zone-tebin', 0.2);
  blob(6070, 2000, 1180, 1330, [1.03, 0.96, 1.06, 1.0, 0.94, 1.07, 1.01, 0.97, 1.05, 0.95, 1.04, 1.0], 'zone-hask', 1.1);
  out.zones.push('<text x="360" y="930" font-size="230" font-weight="800" class="fill-tebin">TEBIN</text>');
  out.zones.push('<text x="5040" y="930" font-size="230" font-weight="800" class="fill-hask">Haskoning</text>');

  // ── TEBIN side ──
  box('t-cap', { x: 360, y: 1180, w: 780, cls: 'box-tebin', titleCls: 'fill-tebin', title: 'Delivery capability', items: [
    'About 70 people, 15–20 of them in Poland and growing to year end',
    'Engineering strength in MEP, where demand is highest',
    'MEP discipline leads and project managers who can lead a discipline',
    'Advanced BIM coordinators',
    'English across project staff, with room to improve'
  ] });
  box('t-mkt', { x: 1360, y: 1020, w: 720, cls: 'box-tebin', titleCls: 'fill-tebin', title: 'Markets and access', items: [
    'Germany is an active main market',
    'Direct access to Swiss contractors',
    'Deep roots in the Ukrainian market',
    'Brought an international investor into Ukraine: design and supporting processes'
  ] });
  hub('t-ua', { x: 1680, y: 2060, r: 215, side: 'tebin', title: 'Ukraine', items: ['Engineering base and legal entity', 'Local signing authority', 'Active projects'] });
  box('t-tech', { x: 360, y: 2470, w: 800, cls: 'box-tebin', titleCls: 'fill-tebin', title: 'Technical depth', items: [
    'BIM coordination and CDE work in Dalux and client platforms',
    'Revit automation: scripts, plugins, families, as internal support tools',
    'MEP calculation across disciplines, including LiNear',
    'Digital Twin delivery',
    'As-built laser scanning with a Polish partner'
  ] });
  box('t-way', { x: 1440, y: 2560, w: 780, cls: 'box-tebin', titleCls: 'fill-tebin', title: 'Ways of working', items: [
    'Agile and Scrum in practice',
    'Short adoption cycle for new IT frameworks',
    'ISO 9001 and ISO 19650 certified',
    'ISO 27001 in preparation'
  ] });

  // ── Haskoning side ──
  box('h-leads', { x: 5120, y: 1040, w: 700, cls: 'box-hask', titleCls: 'fill-hask', title: 'Shared leads', items: [
    'Leads shared across the group’s subsidiaries',
    'Polish opportunities for joint entry'
  ] });
  box('h-train', { x: 6130, y: 1260, w: 780, cls: 'box-hask', titleCls: 'fill-hask', title: 'Training and methodology', items: [
    'Strong learning resources',
    'Methodology and quality frameworks'
  ] });
  hub('h-nl', { x: 5760, y: 2060, r: 215, side: 'hask', title: 'Netherlands', items: ['Group centre', 'Subsidiaries in several countries'] });
  hub('h-more-countries', { x: 6760, y: 2010, r: 135, side: 'hask', title: 'Further countries', titleSize: 38, items: ['add in the room'] });
  box('h-proc', { x: 6180, y: 2400, w: 720, cls: 'box-hask', titleCls: 'fill-hask', title: 'Process maturity', items: [

  var legendToggle = document.getElementById('legend-toggle');
  function toggleLegend() {
    legendPanel.hidden = !legendPanel.hidden;
    legendToggle.setAttribute('aria-pressed', legendPanel.hidden ? 'false' : 'true');
  }
  legendToggle.addEventListener('click', toggleLegend);

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k >= '1' && k <= '9' && chapters[Number(k) - 1]) { go(Number(k) - 1); return; }
    if (k === '0') { go(0); return; }
    if (k === '+' || k === '=') centreZoom(0.8);
    else if (k === '-' || k === '_') centreZoom(1.25);
    else if (k === 'f' || k === 'F') toggleFull();
    else if (k === 't' || k === 'T') toggleTheme();
    else if (k === 'l' || k === 'L') toggleLegend();
    else if (k === 'Escape') clearFocus();
    else if (k.indexOf('Arrow') === 0) {
      var step = cam.w * 0.12;
      if (k === 'ArrowLeft') cam.x -= step;
      if (k === 'ArrowRight') cam.x += step;
      if (k === 'ArrowUp') cam.y -= step;
      if (k === 'ArrowDown') cam.y += step;
      apply();
    } else return;
    e.preventDefault();
  });

  var startChapter = 0;
  try {
    var q = Number(new URLSearchParams(location.search).get('chapter'));
    if (q >= 1 && q <= chapters.length) startChapter = q - 1;
  } catch (_) {}
  cam = fitRect(chapters[startChapter][1], chapters[startChapter][2]);
  apply();
  navButtons[startChapter].classList.add('active');
})();
</script>
</body>
</html>
